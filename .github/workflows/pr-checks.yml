name: PR checks

# 快速的、无需凭据的检查。这个工作流从不访问 AWS，所以 fork 出来的 PR 也会跑。

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.13.5"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

jobs:
  terraform:
    name: fmt + validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare plugin cache
        run: mkdir -p "${TF_PLUGIN_CACHE_DIR}"

      - name: Cache providers
        uses: actions/cache@v6
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-plugins-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: terraform-plugins-${{ runner.os }}-

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff .

      - name: terraform validate
        run: ./scripts/validate.sh

      - name: Tag compliance
        # 依赖离线 plan：检查每个可打标签的资源是否带 Project/Environment/ManagedBy/Repository。
        run: make check-tags

  module-tests:
    name: terraform test (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: [bastion, rds-mysql]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform -chdir=modules/${{ matrix.module }} init -backend=false -input=false -no-color

      - name: terraform test
        run: terraform -chdir=modules/${{ matrix.module }} test -no-color

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install tflint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
          cache: true

      - name: Init tflint plugins
        # 带上 token 可以避免从 release 页面下载插件时撞上 GitHub API 的匿名限流。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tflint --init

      - name: Lint
        run: tflint --recursive --format compact

  scripts:
    name: shellcheck + actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: shellcheck
        run: shellcheck --version && shellcheck --external-sources scripts/*.sh

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          # actionlint v1.7.12 要求 Go >= 1.25。setup-go 会设置
          # GOTOOLCHAIN=local，工具链无法自行升级。
          go-version: "1.25"
          cache: false

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: actionlint
        run: actionlint -color

  security:
    name: checkov
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install checkov
        run: pip install --quiet --disable-pip-version-check checkov

      - name: Scan and gate
        run: ./scripts/scan.sh

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkov-reports
          path: reports/
          retention-days: 14
          if-no-files-found: ignore
