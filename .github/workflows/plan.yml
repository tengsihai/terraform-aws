name: Terraform plan

# 生成 plan 工件：人工评审它，apply 工作流原样执行它。触发场景：
#   * pull_request  -> plan 以粘性评论的形式贴到 PR（评审辅助）
#   * push to main  -> 产出操作员可以真正应用的权威工件
#   * 手动触发

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC -> AWS role
  pull-requests: write # sticky plan comment

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.13.5"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"

jobs:
  plan:
    name: plan (${{ matrix.environment }})
    # fork 出来的 PR 拿不到 OIDC token，也拿不到任何 secret。它们仍然会跑
    # pr-checks.yml 里那些无需凭据的检查；而需要凭据的 plan 对它们只会失败，
    # 所以这里显式跳过，而不是让检查报错。
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: terraform-plan
    strategy:
      fail-fast: false
      matrix:
        # 范围由仓库变量 TF_ENVIRONMENTS 决定（默认 ["dev"]），
        # 尚未接入的环境因此不会被 plan。
        environment: ${{ fromJSON(vars.TF_ENVIRONMENTS || '["dev"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Terraform init
        id: init
        uses: ./.github/actions/terraform-init
        with:
          environment: ${{ matrix.environment }}
          role-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          state-kms-key-arn: ${{ vars.TF_STATE_KMS_KEY_ARN }}
          terraform-version: ${{ env.TERRAFORM_VERSION }}

      - name: Verify aws_account_id matches the assumed role
        shell: bash
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          ACTUAL_ACCOUNT: ${{ steps.init.outputs.account-id }}
        run: |
          set -euo pipefail
          expected="$(sed -nE \
            's/^[[:space:]]*aws_account_id[[:space:]]*=[[:space:]]*"([0-9]{12})".*/\1/p' \
            "environments/${ENVIRONMENT}/env.tfvars" | head -1)"

          if [ -z "${expected}" ]; then
            echo "::error file=environments/${ENVIRONMENT}/env.tfvars::aws_account_id not found"
            exit 1
          fi
          if [ "${expected}" != "${ACTUAL_ACCOUNT}" ]; then
            echo "::error file=environments/${ENVIRONMENT}/env.tfvars::aws_account_id is ${expected} but the assumed role belongs to account ${ACTUAL_ACCOUNT}. Replace the placeholder before planning."
            exit 1
          fi
          echo "account ${ACTUAL_ACCOUNT} matches environments/${ENVIRONMENT}/env.tfvars"

      - name: terraform plan
        id: plan
        shell: bash
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -euo pipefail

          environment_dir="environments/${ENVIRONMENT}"
          report_dir="reports/${ENVIRONMENT}"
          plan_file="${PWD}/${report_dir}/tfplan"
          mkdir -p "${report_dir}"

          set +e
          terraform -chdir="${environment_dir}" plan \
            -var-file=env.tfvars \
            -input=false \
            -no-color \
            -lock-timeout=5m \
            -detailed-exitcode \
            -out="${plan_file}" \
            2>&1 | tee "${report_dir}/plan-output.txt"
          plan_status=${PIPESTATUS[0]}
          set -e

          case "${plan_status}" in
            0) echo "result=no-changes" >> "${GITHUB_OUTPUT}" ;;
            2) echo "result=changes" >> "${GITHUB_OUTPUT}" ;;
            *)
              echo "::error::terraform plan failed for ${ENVIRONMENT} (exit ${plan_status})"
              exit "${plan_status}"
              ;;
          esac

          terraform -chdir="${environment_dir}" show -no-color "${plan_file}" \
            > "${report_dir}/plan.txt"
          terraform -chdir="${environment_dir}" show -json "${plan_file}" \
            > "${report_dir}/plan.json"

          {
            echo "environment=${ENVIRONMENT}"
            echo "commit_sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "plan_sha256=$(sha256sum "${plan_file}" | awk '{print $1}')"
          } > "${report_dir}/manifest.txt"

      - name: Render summary
        if: steps.plan.outcome == 'success'
        shell: bash
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          python3 .github/scripts/render-plan-summary.py \
            --plan-json "reports/${ENVIRONMENT}/plan.json" \
            --environment "${ENVIRONMENT}" \
            --commit "${GITHUB_SHA}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --artifact "terraform-plan-${ENVIRONMENT}" \
            --output "reports/${ENVIRONMENT}/summary.md"

          cat "reports/${ENVIRONMENT}/summary.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload plan artifact
        # 即使失败也上传，方便排查；但只有 conclusion=success 的 run
        # 才允许被 apply 工作流使用。
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan-${{ matrix.environment }}
          path: reports/${{ matrix.environment }}/
          retention-days: 5
          if-no-files-found: ignore

      - name: Comment plan on pull request
        if: github.event_name == 'pull_request' && steps.plan.outcome == 'success'
        uses: actions/github-script@v9
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        with:
          script: |
            const fs = require('fs');
            const marker = `<!-- terraform-plan:${process.env.ENVIRONMENT} -->`;
            const summaryPath = `reports/${process.env.ENVIRONMENT}/summary.md`;
            const body = fs.readFileSync(summaryPath, 'utf8').slice(0, 60000);

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            if (!issue_number) {
              core.info('Not a pull request context; skipping comment.');
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(
              (c) => typeof c.body === 'string' && c.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
              core.info(`Updated comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
              core.info('Created plan comment');
            }
