name: Terraform apply

# 应用 main 上产出的 plan 工件。合并本身即审批：
#
#   PR -> 必须通过的检查 -> 人工合并 -> main 上出 plan -> apply
#
# 自动路径没有额外的审批步骤。staging 和 production 在加入 TF_ENVIRONMENTS
# 之前，必须先把 required reviewers 在对应的 GitHub Environment 上加回来。
#
# 这里刻意不提供 workflow_dispatch：失败后要重放，直接重跑失败的 apply job
# （它应用的是同一份 plan；如果底层 state 变了，Terraform 的陈旧检查会拒绝）。

on:
  workflow_run:
    workflows: [Terraform plan]
    types: [completed]

permissions:
  contents: read
  id-token: write # GitHub OIDC -> AWS role
  actions: read # download the plan artifact from the plan run

env:
  TERRAFORM_VERSION: "1.13.5"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  PLAN_MAX_AGE_HOURS: "24"

jobs:
  apply:
    name: apply (${{ matrix.environment }})
    # 只应用「main 上由 push（即一次合并）产生的 plan」。
    # PR 产生的 plan（head_branch 是功能分支）和手动触发的 plan 在这里一律忽略。
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 这里提供该环境的 apply 角色 ARN；如果某个环境需要独立于合并再卡一道，
    # 就在这个 Environment 上加 required reviewers。
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(vars.TF_ENVIRONMENTS || '["dev"]') }}

    # 绝不取消进行中的 apply：半途而废的 apply 比排队等待糟糕得多。
    concurrency:
      group: terraform-apply-${{ matrix.environment }}
      cancel-in-progress: false

    steps:
      - name: Resolve and verify the plan run
        id: plan_run
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAN_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          api="repos/${GITHUB_REPOSITORY}/actions/runs/${PLAN_RUN_ID}"
          if ! run_json="$(gh api "${api}" 2>/dev/null)"; then
            echo "::error::plan run ${PLAN_RUN_ID} not found in ${GITHUB_REPOSITORY}"
            exit 1
          fi

          status="$(jq -r '.status' <<<"${run_json}")"
          conclusion="$(jq -r '.conclusion' <<<"${run_json}")"
          event="$(jq -r '.event' <<<"${run_json}")"
          branch="$(jq -r '.head_branch' <<<"${run_json}")"
          sha="$(jq -r '.head_sha' <<<"${run_json}")"
          workflow_path="$(jq -r '.path' <<<"${run_json}")"

          if [ "${status}" != "completed" ] || [ "${conclusion}" != "success" ]; then
            echo "::error::plan run ${PLAN_RUN_ID} finished as ${status}/${conclusion}; only successful runs can be applied"
            exit 1
          fi

          case "${event}" in
            push | workflow_dispatch) ;;
            *)
              echo "::error::plan run ${PLAN_RUN_ID} came from '${event}'; only push/workflow_dispatch runs on main are accepted"
              exit 1
              ;;
          esac

          if [ "${branch}" != "main" ]; then
            echo "::error::plan run ${PLAN_RUN_ID} ran on '${branch}', not main"
            exit 1
          fi

          if [ "${workflow_path}" != ".github/workflows/plan.yml" ]; then
            echo "::error::run ${PLAN_RUN_ID} was produced by '${workflow_path}', not the plan workflow"
            exit 1
          fi

          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "${sha}" != "${main_sha}" ]; then
            echo "::error::main moved since this plan was produced (plan ${sha:0:12}, main ${main_sha:0:12}); a newer plan will be applied by its own run"
            exit 1
          fi

          {
            echo "head_sha=${sha}"
            echo "plan_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${PLAN_RUN_ID}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout the exact commit that produced the plan
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.plan_run.outputs.head_sha }}
          persist-credentials: false

      - name: Download the plan artifact
        uses: actions/download-artifact@v8
        with:
          name: terraform-plan-${{ matrix.environment }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/plan

      - name: Verify the plan artifact
        id: verify
        shell: bash
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          PLAN_DIR: ${{ runner.temp }}/plan
          EXPECTED_SHA: ${{ steps.plan_run.outputs.head_sha }}
        run: |
          set -euo pipefail
          cd "${PLAN_DIR}"

          for required in tfplan plan.txt plan.json manifest.txt; do
            [ -f "${required}" ] || { echo "::error::artifact is missing ${required}"; exit 1; }
          done

          expected_sum="$(sed -n 's/^plan_sha256=//p' manifest.txt)"
          actual_sum="$(sha256sum tfplan | awk '{print $1}')"
          if [ "${expected_sum}" != "${actual_sum}" ]; then
            echo "::error::plan checksum mismatch (manifest ${expected_sum}, file ${actual_sum})"
            exit 1
          fi

          manifest_env="$(sed -n 's/^environment=//p' manifest.txt)"
          if [ "${manifest_env}" != "${ENVIRONMENT}" ]; then
            echo "::error::artifact targets '${manifest_env}', not '${ENVIRONMENT}'"
            exit 1
          fi

          manifest_sha="$(sed -n 's/^commit_sha=//p' manifest.txt)"
          if [ "${manifest_sha}" != "${EXPECTED_SHA}" ]; then
            echo "::error::artifact was planned from ${manifest_sha}, expected ${EXPECTED_SHA}"
            exit 1
          fi

          created="$(sed -n 's/^created_at=//p' manifest.txt)"
          created_epoch="$(date -u -d "${created}" +%s)"
          age_hours=$(( ($(date -u +%s) - created_epoch) / 3600 ))
          if [ "${age_hours}" -gt "${PLAN_MAX_AGE_HOURS}" ]; then
            echo "::error::plan is ${age_hours}h old (limit ${PLAN_MAX_AGE_HOURS}h); re-run the plan workflow"
            exit 1
          fi

          # 「没有变更」的 plan 里 applyable 就是 false，这是不触及基础设施的
          # 合并的正常结果。判断 plan 是否健康要看 complete 和 errored，
          # 它们才能区分「干净的空变更」和「坏掉的 plan」。
          if [ "$(jq -r '.complete // false' plan.json)" != "true" ] \
            || [ "$(jq -r '.errored // false' plan.json)" = "true" ]; then
            echo "::error::plan is incomplete or errored; refusing to apply"
            exit 1
          fi

          if [ "$(jq -r '.applyable // false' plan.json)" = "true" ]; then
            echo "has_changes=true" >> "${GITHUB_OUTPUT}"
            echo "plan verified: ${age_hours}h old, sha256 ${actual_sum}"
          else
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
            echo "plan has no changes; the apply step will be skipped"
          fi

      - name: Terraform init
        id: init
        uses: ./.github/actions/terraform-init
        with:
          environment: ${{ matrix.environment }}
          role-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          state-kms-key-arn: ${{ vars.TF_STATE_KMS_KEY_ARN }}
          terraform-version: ${{ env.TERRAFORM_VERSION }}

      - name: Confirm account matches env.tfvars
        shell: bash
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          ACTUAL_ACCOUNT: ${{ steps.init.outputs.account-id }}
        run: |
          set -euo pipefail
          expected="$(sed -nE \
            's/^[[:space:]]*aws_account_id[[:space:]]*=[[:space:]]*"([0-9]{12})".*/\1/p' \
            "environments/${ENVIRONMENT}/env.tfvars" | head -1)"
          if [ "${expected}" != "${ACTUAL_ACCOUNT}" ]; then
            echo "::error::env.tfvars account ${expected} != assumed role account ${ACTUAL_ACCOUNT}"
            exit 1
          fi

      - name: terraform apply (saved plan only)
        if: steps.verify.outputs.has_changes == 'true'
        shell: bash
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          PLAN_FILE: ${{ runner.temp }}/plan/tfplan
        run: |
          set -euo pipefail
          # 应用已评审的 plan 工件。这里不会重新 plan，
          # 所以合并时批准的内容就是实际执行的内容。
          terraform -chdir="environments/${ENVIRONMENT}" apply \
            -input=false \
            -no-color \
            -auto-approve \
            -lock-timeout=5m \
            "${PLAN_FILE}"

      - name: Write run summary
        if: always()
        shell: bash
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          PLAN_URL: ${{ steps.plan_run.outputs.plan_url }}
          PLAN_DIR: ${{ runner.temp }}/plan
          HAS_CHANGES: ${{ steps.verify.outputs.has_changes }}
        run: |
          {
            echo "## Apply ${ENVIRONMENT}"
            echo ""
            if [ "${HAS_CHANGES}" = "true" ]; then
              echo "Applied the reviewed plan."
            else
              echo "**No changes to apply.** The plan matched the deployed state."
            fi
            echo ""
            echo "- Reviewed plan: ${PLAN_URL}"
            echo "- Commit: \`${{ steps.plan_run.outputs.head_sha }}\`"
            echo "- Plan checksum: \`$(sed -n 's/^plan_sha256=//p' "${PLAN_DIR}/manifest.txt" 2>/dev/null || echo unknown)\`"
            echo ""
            echo "<details><summary>Applied plan</summary>"
            echo ""
            echo '```'
            head -c 40000 "${PLAN_DIR}/plan.txt" 2>/dev/null || true
            echo '```'
            echo ""
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload apply log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apply-${{ matrix.environment }}-${{ github.run_id }}
          path: ${{ runner.temp }}/plan/
          retention-days: 30
          if-no-files-found: ignore
