version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  # Terraform 按目录管理，每个根目录/模块都要单独列一条。
  - package-ecosystem: terraform
    directory: /modules/vpc
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: terraform
    directory: /modules/logging-s3
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: terraform
    directory: /environments/dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: terraform
    directory: /environments/staging
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: terraform
    directory: /environments/prod
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: terraform
    directory: /bootstrap
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
